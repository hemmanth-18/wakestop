name: wakestop_mobile
description: "WakeStop — Live GPS Transit Alarm & Early Battery Prevention App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  geolocator: ^10.1.0
  flutter_foreground_task: ^6.1.0
  flutter_local_notifications: ^16.3.0
  audioplayers: ^5.2.1
  vibration: ^1.8.4
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  http: ^1.2.0
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
